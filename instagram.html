  <style>
    body {
      margin: 0;
      padding: 0;
    }

    .grid-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: auto auto auto;
      gap: 5px;
    }

    .photo-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;   /* keep it square */
      overflow: hidden;
      padding: 0;
      border: none;
      background: none;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;   /* fit inside the square */
      display: block;
    }
    
    .photo-item a:hover { 
      border: 0.5px dashed #ff948fb;
      transform: scale(1.05);
    }
    

    @media (max-width: 600px) {
      .grid-wrapper {
        padding: 2px;
      }
      .photo-grid {
        gap: 2px;
      }
    }
    
  </style>
  
</head>
