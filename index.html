<!-- JS ZONE JS ZONE -->

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const layout = document.querySelector('.log-layout');
    const viewer = document.getElementById('log-viewer');
    const iframe = document.getElementById('log-iframe');   // your viewer iframe
    const placeholder = viewer ? viewer.querySelector('.log-viewer-placeholder') : null;
    const left = document.querySelector('.log-left');
    const listSection = left ? left.querySelector('section') : null;

    if (!left || !listSection || !iframe || !viewer) {
      console.warn('Log layout elements not found');
      return;
    }

    let activeLink = null;

    // Single delegated click handler for ALL links in .log-left
    left.addEventListener('click', function (e) {
      const link = e.target.closest('a[href]');
      if (!link || !left.contains(link)) return;

      const href = link.getAttribute('href');
      if (!href) return;

      // Always load into the iframe; never navigate away
      e.preventDefault();

      // Hide placeholder + show iframe area
      if (placeholder) {
        placeholder.style.display = 'none';
      }
      if (layout) {
        layout.classList.add('log-has-selection');
      }

      iframe.src = href;

      // ---- 1) Update active marker ----
      if (activeLink) {
        activeLink.classList.remove('log-note-active');
      }
      link.classList.add('log-note-active');
      activeLink = link;

      // ---- 2) Scroll so this note becomes "first" in the strip/grid ----
      const containerRect = listSection.getBoundingClientRect();
      const noteRect = link.getBoundingClientRect();

      if (window.innerWidth < 600) {
        // Mobile: horizontal strip → active note farthest LEFT
        const offsetLeft = noteRect.left - containerRect.left + listSection.scrollLeft;
        const targetLeft = Math.max(offsetLeft - 10, 0); // small padding

        listSection.scrollTo({
          left: targetLeft,
          behavior: 'smooth'
        });
      } else {
        // Desktop: vertical scroller → active note at the TOP
        const offsetTop = noteRect.top - containerRect.top + listSection.scrollTop;
        const targetTop = Math.max(offsetTop - 10, 0);

        listSection.scrollTo({
          top: targetTop,
          behavior: 'smooth'
        });
      }
    });
  });
</script>
