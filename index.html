</div>

    <!-- RIGHT: viewer -->
    <aside class="log-right" aria-label="Log entry viewer">
      <div id="log-viewer" class="log-viewer">
        <p class="log-viewer-placeholder" contenteditable="true">Click an entry... or scribble something yourself!</p>
           <iframe
              id="log-iframe"
              title="Log entry"
              height="100%"
              width="100%"
              style="border:none"
              src=""
            ></iframe>
      </div>
    </aside>

</body>

<!-- JS ZONE JS ZONE -->

<script>
  const mq = window.matchMedia('(min-width: 600px)');
  const links = document.querySelectorAll('.log-left section a[href]');
  const layout = document.querySelector('.log-layout');
  const viewer = document.getElementById('log-viewer');
  const iframe = document.getElementById('log-iframe');
  const placeholder = viewer.querySelector('.log-viewer-placeholder');

  function handleClick(e) {
    const href = this.getAttribute('href');
    if (!href) return;

    // On small screens: just behave like a normal link (open the doc)
    if (!mq.matches) return;

    // On desktop: load into the iframe instead
    e.preventDefault();

    if (placeholder) {
      placeholder.style.display = 'none';
    }

    iframe.src = href;
    layout.classList.add('log-has-selection');
  }

  links.forEach(link => link.addEventListener('click', handleClick));
</script>


</html>
