<!-- Layout activator -->
  <script>
  (function () {
    const layout = document.querySelector('.log-layout');
    const viewer = document.getElementById('log-viewer');

    if (!layout || !viewer) return;

    const mq = window.matchMedia('(min-width: 600px)');
    const links = layout.querySelectorAll('.log-left section a[href]');

    function handleClick(e) {
      const href = this.getAttribute('href');
      if (!href) return;

      // On small screens: just behave normally (navigate)
      if (!mq.matches) {
        return;
      }

      // On larger screens: intercept and load into viewer
      e.preventDefault();

      fetch(href)
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(html => {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');

          const meta = doc.querySelector('#meta');
          const article = doc.querySelector('article');

          let inner = '';
          if (meta) inner += meta.outerHTML;
          if (article) inner += article.outerHTML;

          if (!inner) {
            inner = '<p>Could not load that entry.</p>';
          }

          viewer.innerHTML = inner;
          layout.classList.add('log-has-selection');
          viewer.scrollTop = 0;
        })
        .catch(err => {
          console.error('Error loading log entry:', err);
          // fallback: if something blows up, just navigate
          window.location.href = href;
        });
    }

    links.forEach(link => {
      link.addEventListener('click', handleClick);
    });
  })();
  </script>
</body>


<script>
(function () {
  const layout = document.querySelector('.log-layout');
  const viewer = document.getElementById('log-viewer');

  if (!layout || !viewer) return;

  const mediaQuery = window.matchMedia('(min-width: 600px)');
  const links = layout.querySelectorAll('section a[href]');

  function handleClick(event) {
    const href = this.getAttribute('href');
    if (!href) return;

    // On small screens, behave normally (navigate to entry page)
    if (!mediaQuery.matches) {
      return;
    }

    // Large screens: load into viewer instead
    event.preventDefault();

    fetch(href)
      .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
      })
      .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Try to get meta + article from the entry page
        const meta = doc.querySelector('#meta');
        const article = doc.querySelector('article');

        let inner = '';
        if (meta) inner += meta.outerHTML;
        if (article) inner += article.outerHTML;

        if (!inner) {
          inner = '<p>Could not load that entry.</p>';
        }

        viewer.innerHTML = inner;
        layout.classList.add('log-has-selection');
        viewer.scrollTop = 0;
      })
      .catch(err => {
        console.error('Error loading log entry:', err);
        // Fallback: if something goes wrong, just navigate normally
        window.location.href = href;
      });
  }

  links.forEach(link => {
    link.addEventListener('click', handleClick);
  });
})();
</script>
